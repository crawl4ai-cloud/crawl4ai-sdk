name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.f.outputs.python }}
      node: ${{ steps.f.outputs.node }}
      go: ${{ steps.f.outputs.go }}
      rust: ${{ steps.f.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python: python/**
            node: node/**
            go: go/**
            rust: rust/**
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' && hashFiles('python/pyproject.toml') != ''
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: python}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]" && pytest
  node:
    needs: changes
    if: needs.changes.outputs.node == 'true' && hashFiles('node/package.json') != ''
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: node}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci && npm test
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true' && hashFiles('go/go.mod') != ''
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: go}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - run: go test ./...
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && hashFiles('rust/Cargo.toml') != ''
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: rust}}
    steps:
      - uses: actions/checkout@v7
      - run: cargo test
