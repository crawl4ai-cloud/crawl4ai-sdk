name: Bug
description: Something in an SDK does not work
labels: [bug]
body:
  - type: dropdown
    id: sdk
    attributes: {label: Which SDK, options: [Python, Node, Go, Rust]}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: SDK version}
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Include the code you ran. Remove your API key first.
    validations: {required: true}
