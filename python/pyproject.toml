[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawl4ai-cloud-sdk"
dynamic = ["version"]
description = "The official Python client for the Crawl4AI Cloud API: web pages to Markdown and JSON, web search, Google results and answers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
keywords = ["crawl4ai", "web scraping", "crawler", "markdown", "llm", "search", "serp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://crawl4ai.com"
Documentation = "https://crawl4ai.com/docs/"
Source = "https://github.com/crawl4ai-cloud/crawl4ai-sdk/tree/main/python"
Issues = "https://github.com/crawl4ai-cloud/crawl4ai-sdk/issues"

[tool.hatch.version]
path = "src/crawl4ai_cloud/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crawl4ai_cloud"]
